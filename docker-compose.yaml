services:
  srvcman:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: srvcman
    ports:
      - "8083:8000" # Maps port 8080 on your host to port 80 on the container
    volumes:
      - ./.env:/build/.env:ro # Mount your static HTML directory
    environment:
      - VIRTUAL_HOST=arkgate02.workload.it.com
      - VIRTUAL_PORT=44444
      - LETSENCRYPT_HOST=arkgate02.workload.it.com
    networks:
      - nginx-reverse-proxy

networks:
  nginx-reverse-proxy:
    external: true
